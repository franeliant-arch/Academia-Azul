<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mensaje enviado con éxito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0a2a66, #1e5bb8);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      text-align: center;
    }

    .card {
      background: #ffffff;
      color: #0a2a66;
      padding: 40px 30px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      margin: 15px 0;
    }

    .emoji {
      font-size: 48px;
      margin-bottom: 10px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #1e5bb8;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    a:hover {
      background: #163f85;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="emoji">✅</div>
    <h1>¡Mensaje enviado con éxito!</h1>
    <p>
      Gracias por solicitar tu ebook.<br>
      Hemos recibido correctamente tu correo.
    </p>
    <p>
      En breve te enviaremos el enlace de lectura 📘  
      (revisa también la carpeta de spam).
    </p>

    <a href="/">Volver a la página principal</a>
  </div>

</body>
</html>
